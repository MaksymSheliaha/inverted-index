<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            border-radius: 10px;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: #dc3545;
            line-height: 1;
        }
    </style>
</head>
<body>

<div class="card error-card shadow-sm text-center p-4">
    <div class="card-body">
        <div class="error-code mb-3">404</div>
        <h2 class="card-title fw-bold mb-2">Page Not Found</h2>
        <p class="card-text text-muted mb-4">
            The requested URL was not found on this server. Please check the address or return to the main search page.
        </p>
        <a href="/" class="btn btn-primary px-4 py-2">
            Back to Search
        </a>
    </div>
</div>

</body>
</html>
