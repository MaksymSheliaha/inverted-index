services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inverted-index-app
    ports:
      - "8080:8080"
      - "9010:9010"
    environment:
      - SOURCE_INPUT_PATH=/app/index_files
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - JAVA_TOOL_OPTIONS=-Xms1g -Xmx6g -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=9010 -Dcom.sun.management.jmxremote.rmi.port=9010 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1
    volumes:
      - ./index_files:/app/index_files
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.11
    container_name: ollama
    ports: 
      - "11434:11434"
    volumes:
      - ./model_files:/model_files
      - ollama_data:/root/.ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/model_files/run_ollama.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${OLLAMA_GPU_DRIVER:-nvidia}
              count: ${OLLAMA_GPU_COUNT:-all}
              capabilities:
                - gpu
        limits:
          memory: 6G

volumes:
  ollama_data: